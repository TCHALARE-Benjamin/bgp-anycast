frr defaults traditional
hostname rc
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.3.2 remote-as 65003
 !
 address-family ipv4 unicast
  network 10.0.0.0/24
  neighbor 10.0.1.2 route-map FROM-N1 in
  neighbor 10.0.2.2 route-map FROM-N2 in
  neighbor 10.0.3.2 route-map FROM-N3 in
 exit-address-family
!
route-map FROM-N1 permit 10
 set local-preference 200
!
route-map FROM-N2 permit 10
 set local-preference 150
!
route-map FROM-N3 permit 10
 set local-preference 100
!